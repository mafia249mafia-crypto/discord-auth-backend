<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع حرس الحدود بمقاطعة بوليتو الرسمي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="fonts.googleapis.com/css2.css" rel="stylesheet">
    <style>
        
        :root {
            --primary: #1c5b42;
            --primary-light: #2d7a5a;
            --primary-dark: #0a2e21;
            --accent: #d4af37;
            --accent-light: #f1c40f;
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --background: #051410;
            --foreground: #f8fafc;
            --card: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --muted: #94a3b8;
            --border: rgba(212, 175, 55, 0.15);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        .dark {
            --primary: #1c5b42;
            --primary-light: #2d7a5a;
            --primary-dark: #0a2e21;
            --accent: #d4af37;
            --accent-light: #f1c40f;
            --background: #051410;
            --foreground: #f8fafc;
            --card: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --muted: #94a3b8;
            --border: rgba(212, 175, 55, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--background); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        .apR-container { display: flex; min-height: 100vh; }

        /* Enhanced Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0a2e21 0%, #051410 100%);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border-left: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar-header {
            padding: 3rem 1.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            text-align: center;
            position: relative;
        }
        .sidebar-logos img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
            animation: float 4s ease-in-out infinite;
        }
        .sidebar-title {
            margin-top: 0.75rem;
            font-size: 0.95rem;
            font-weight: 800;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .sidebar-nav { padding: 1rem 0.75rem; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 12px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .nav-item:hover {
            background: rgba(212, 175, 55, 0.05);
            color: #d4af37;
            transform: translateX(-3px);
            border-color: rgba(212, 175, 55, 0.1);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #1c5b42, #0a2e21);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; transition: transform 0.4s; }
        .nav-item.active svg { color: #d4af37; }
        .nav-item:hover svg { transform: scale(1.1) rotate(-3deg); }
        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: rgba(255,255,255,0.95);
            font-size: 0.75rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-right: 280px;
            min-height: 100vh;
            background: var(--background);
        }

        /* Page Animations */
        .page { display: none; }
        .page.active { display: block; animation: pageIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Enhanced Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::before { opacity: 1; }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }
        .card-header { padding: 1.5rem 1.5rem 1rem; }
        .card-content { padding: 1.5rem; }
        .card-title { font-size: 1.125rem; font-weight: 700; }

        /* Enhanced Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            font-family: inherit;
            border: none;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after { width: 300px; height: 300px; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            box-shadow: 0 4px 15px rgba(92, 108, 75);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(92, 108, 75);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--foreground);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(92, 108, 75);
        }
        .btn-lg { padding: 1rem 2rem; font-size: 1rem; }
        .btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
        .btn:hover svg { transform: translateX(-3px); }

        /* Enhanced Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .badge-secondary {
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.1), rgba(100, 116, 139, 0.2));
            color: var(--muted);
        }
        .badge-outline {
            background: transparent;
            border: 1.5px solid var(--border);
        }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: slideRight 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .page-header-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .page-header-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 18px;
            background: inherit;
            opacity: 0.3;
            filter: blur(8px);
            z-index: -1;
        }
        .page-header-icon svg { width: 28px; height: 28px; }
        .page-header-text h1 { font-size: 1.75rem; font-weight: 800; }
        .page-header-text p { font-size: 0.9rem; color: var(--muted); margin-top: 0.25rem; }

        /* Hero Section */
        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #051410 0%, #1c5b42 100%);
            padding: 6rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.1), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(28, 91, 66, 0.2), transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .hero-content {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .hero-logos {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }
        .hero-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: heroFloat 5s ease-in-out infinite;
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .hero-title {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.2s both;
        }
        .hero-divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 1.5rem;
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.4s both;
        }
        .hero-subtitle {
            font-size: 1.35rem;
            color: #d4af37;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.6s both;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .hero-desc {
            color: rgba(191, 219, 254, 0.7);
            margin-top: 1rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1rem;
            animation: fadeUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s both;
        }
        .hero-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, var(--background), transparent);
        }

        /* Home Cards Grid */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
            margin-top: -3rem;
        }
        /* Officials Portal Grid */
        .officials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* Default for larger screens */
            gap: 1.25rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .officials-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .officials-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .officials-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
        .home-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: cardIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .home-card:nth-child(1) { animation-delay: 0.1s; }
        .home-card:nth-child(2) { animation-delay: 0.15s; }
        .home-card:nth-child(3) { animation-delay: 0.2s; }
        .home-card:nth-child(4) { animation-delay: 0.25s; }
        .home-card:nth-child(5) { animation-delay: 0.3s; }
        .home-card:nth-child(6) { animation-delay: 0.35s; }
        .home-card:nth-child(7) { animation-delay: 0.4s; }
        .home-card:nth-child(8) { animation-delay: 0.45s; }
        .home-card:nth-child(9) { animation-delay: 0.5s; }
        .home-card:nth-child(10) { animation-delay: 0.55s; }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .home-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .home-card:hover::before { transform: scaleX(1); transform-origin: left; }
        .home-card {
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border-radius: 30px;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.12);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .home-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(212, 175, 55, 0.5);
            background: linear-gradient(165deg, rgba(212, 175, 55, 0.08), rgba(28, 91, 66, 0.05));
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .home-card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1.5px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
        }
        .home-card:hover .home-card-icon {
            transform: translateY(-5px) rotate(5deg);
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #051410;
            border-color: #ffffff;
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
        }
        .home-card-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.5;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .home-card:hover .home-card-icon svg {
            transform: scale(1.1);
        }
        .home-card h3 {
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            transition: all 0.3s ease;
            letter-spacing: -0.2px;
            text-align: center;
        }
        .home-card:hover h3 {
            color: #d4af37;
        }
        .home-card p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0;
            transition: color 0.3s ease;
            max-width: 250px;
            text-align: center;
        }
        .home-card:hover p {
            color: #f8fafc;
        }
        .home-card-arrow {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #d4af37;
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .home-card:hover .home-card-arrow {
            opacity: 1;
            transform: translateY(0);
        }
        .home-card-dot {
            position: absolute;
            top: 1.25rem;
            left: 1.25rem;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4af37;
            box-shadow: 0 0 10px #d4af37;
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s ease;
        }
        .home-card:hover .home-card-dot { opacity: 1; transform: scale(1); }

        /* About Section */
        .about-section {
            max-width: 1400px;
            margin: 3rem auto 2rem;
            padding: 0 1.5rem;
        }
        .about-section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .about-section-logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        .about-section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }
        .about-section-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .about-section-content::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #5c6c4b 0%, #1c5b42 100%);
            border-radius: 0 4px 4px 0;
        }
        .about-main-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 1rem 0;
            line-height: 1.6;
        }
        .about-section-content p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 2;
            text-align: justify;
            margin: 0;
        }

        /* Official Notice */
        .official-notice {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-top: 1.5rem;
        }
        .official-notice-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .official-notice-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }
        .official-notice p {
            color: #d4af37;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.6;
        }

        /* Documents Selector */
        .docs-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .docs-selector-card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .docs-selector-card.public-security {
            background: linear-gradient(135deg, rgba(92, 108, 75), rgba(92, 108, 75));
            border-color: rgba(92, 108, 75);
        }
        .docs-selector-card.public-security:hover {
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(92, 108, 75);
        }
        .docs-selector-card.road-security {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            border-color: rgba(34, 197, 94, 0.3);
        }
        .docs-selector-card.road-security:hover {
            border-color: rgba(34, 197, 94, 0.6);
            transform: translateY(-4px);

        window.closeComingSoonPopup = function() {
            const popup = document.getElementById('coming-soon-popup');
            if (popup) {

                popup.querySelector('.features-popup-content').style.transform = 'scale(0.9) translateY(20px)';

                    document.body.style.overflow = '';

        window.filterMilitaryVehicles = function() {
            const rankFilter = document.getElementById('rank-filter').value;
            const typeFilter = document.getElementById('type-filter').value;
            const grid = document.getElementById('military-vehicles-grid');
            const countBadge = document.getElementById('military-vehicle-count');
            
            const filtered = vehiclesData.filter(v => {
                const rankMatch = rankFilter === 'all' || v.rank === rankFilter || (rankFilter === 'officers' && rankOrder.indexOf(v.rank) >= rankOrder.indexOf('ملازم')) || (rankFilter === 'enlisted' && rankOrder.indexOf(v.rank) < rankOrder.indexOf('ملازم'));
                const typeMatch = typeFilter === 'all' || v.type === typeFilter;
                return rankMatch && typeMatch;
            });

            countBadge.textContent = `${filtered.length} مركبة عسكرية`;
            
            grid.innerHTML = filtered.map(v => `
                <div class="military-vehicle-card-premium">
                    <div class="vehicle-card-media">
                        <img src="${v.image}" alt="${v.name}" class="vehicle-card-img">
                        <div class="vehicle-type-tag ${v.type === 'سري' ? 'secret' : v.type === 'دورة' ? 'course' : v.type === 'سوات' ? 'swat' : v.type === 'شرطة عسكرية' ? 'mp' : ''}">

            switch(page) {
                case 'home': return getHomePage();

                case 'tutorials': return getTutorialsPage();
                case 'recruits-portal': return getRecruitsPortalPage();

                case 'equipment-vehicles': return getEquipmentVehiclesPage();

        // Backend URL (Flask app)
        const BACKEND_URL = "https://sevenaras-7odod-boleto-id-check.onrender.com"; // رابط الخدمة الخلفية المستضافة على Render

        function getDeviceId() {
            const storageKey = 'bg_device_id';
            let existing = localStorage.getItem(storageKey);
            if (existing) return existing;
            let created = '';
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                created = window.crypto.randomUUID();
            } else {
                created = 'dev-' + Math.random().toString(16).slice(2) + Date.now().toString(16);
            }
            localStorage.setItem(storageKey, created);
            return created;
        }

        function isOfficialsDepartmentId(value) {
            return value === 'military-police'
                || value === 'admin-affairs'
                || value === 'sector-command'
                || value === 'recruitment-affairs'
                || value === 'officer-affairs'
                || value === 'senior-officer-affairs';
        }

        async function verifyDepartmentAccess(departmentId, options) {
            const verificationMessage = document.getElementById(`verificationMessage-${departmentId}`);
            const verificationForm = document.getElementById(`verificationForm-${departmentId}`);
            const departmentContent = document.getElementById(`${departmentId}Content`);
            const idInput = document.getElementById(`idInput-${departmentId}`);
            const silent = options && options.silent === true;
            const forcedUserId = options && options.userId ? String(options.userId).trim() : '';
            const userId = forcedUserId || (idInput ? String(idInput.value || '').trim() : '');

            if (!userId) {
                if (!silent && verificationMessage) {
                    verificationMessage.style.color = '#f1c40f';
                    verificationMessage.innerText = 'اكتب الايدي أولاً.';
                }
                return;
            }

            if (verificationMessage) {
                verificationMessage.style.color = '#f1c40f';
                verificationMessage.innerText = 'جاري التحقق...';
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        department_id: departmentId,
                        user_id: userId,
                        device_id: getDeviceId()
                    })
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok && data.status === 'success') {
                    if (verificationMessage) {
                        verificationMessage.style.color = '#10b981';
                        verificationMessage.innerText = 'تم التحقق بنجاح.';
                    }
                    if (verificationForm) verificationForm.style.display = 'none';
                    if (departmentContent) departmentContent.style.display = 'block';
                    localStorage.setItem(`verified_user_${departmentId}`, userId);
                    if (departmentId === 'sector-command') {
                        localStorage.setItem('sector_admin_id', userId);
                        const label = document.getElementById('sectorAdminIdLabel');
                        if (label) label.textContent = userId;
                        setTimeout(() => sectorAdminRefreshAll(), 50);
                    }
                } else {
                    let msg = 'فشل التحقق.';
                    if (data && data.reason === 'id_not_allowed') msg = 'فشل التحقق: الايدي غير موجود في قاعدة البيانات.';
                    if (data && data.reason === 'hwid_mismatch') msg = 'مرفوض: هذا الايدي مربوط بجهاز آخر.';
                    if (data && data.reason === 'invalid_request') msg = 'طلب غير صالح.';
                    if (verificationMessage) {
                        verificationMessage.style.color = '#ef4444';
                        verificationMessage.innerText = msg;
                    }
                    if (verificationForm) verificationForm.style.display = 'block';
                    if (departmentContent) departmentContent.style.display = 'none';
                }
            } catch (e) {
                if (verificationMessage) {
                    verificationMessage.style.color = '#ef4444';
                    verificationMessage.innerText = 'تعذر الاتصال بالخادم.';
                }
                if (verificationForm) verificationForm.style.display = 'block';
                if (departmentContent) departmentContent.style.display = 'none';
            }
        }

        function maybeAutoVerifyDepartment(page) {
            if (!isOfficialsDepartmentId(page)) return;
            const savedUserId = String(localStorage.getItem(`verified_user_${page}`) || '').trim();
            if (!savedUserId) return;
            const idInput = document.getElementById(`idInput-${page}`);
            if (idInput && !String(idInput.value || '').trim()) {
                idInput.value = savedUserId;
            }
            verifyDepartmentAccess(page, { userId: savedUserId, silent: true });
        }

        function getSectorAdminContext() {
            const adminUserId = String(localStorage.getItem('sector_admin_id') || '').trim();
            return {
                admin_user_id: adminUserId,
                admin_device_id: getDeviceId()
            };
        }

        function setSectorManageMsg(text, color) {
            const el = document.getElementById('sectorManageMsg');
            if (!el) return;
            el.style.color = color || 'rgba(255,255,255,0.8)';
            el.textContent = text || '';
        }

        const SECTOR_DEPARTMENTS = [
            { id: 'military-police', title: 'الشرطة العسكرية' },
            { id: 'admin-affairs', title: 'الشؤون الادارية' },
            { id: 'sector-command', title: 'قيادة القطاع' },
            { id: 'recruitment-affairs', title: 'شؤون التجنيد' },
            { id: 'officer-affairs', title: 'شؤون ضباط' },
            { id: 'senior-officer-affairs', title: 'شؤون كبار ضباط' }
        ];

        function normalizeSearchText(value) {
            return String(value || '').toLowerCase().trim();
        }

        function renderSectorItems(departmentId, items, targetElId) {
            const el = document.getElementById(targetElId);
            if (!el) return;
            if (!items || items.length === 0) {
                el.innerHTML = `<div style="color: rgba(255,255,255,0.7); font-weight: 900; padding: 0.75rem 0.5rem;">لا توجد ايديات.</div>`;
                return;
            }
            el.innerHTML = items.map(item => `
                <div class="sector-item">
                    <div class="sector-item-text">
                        <div class="sector-item-name">${item.user_name ? item.user_name : 'بدون اسم'}</div>
                        <div class="sector-item-id">${item.user_id}</div>
                    </div>
                    <div class="sector-item-actions">
                        <button class="sector-mini-btn sector-mini-hwid" onclick="sectorAdminResetHwid('${item.user_id}')">HWID</button>
                        <button class="sector-mini-btn sector-mini-remove" onclick="sectorAdminRemoveId('${departmentId}','${item.user_id}')">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        async function fetchSectorDepartmentItems(departmentId) {
            const ctx = getSectorAdminContext();
            const response = await fetch(`${BACKEND_URL}/api/ids/list?department_id=${encodeURIComponent(departmentId)}&admin_user_id=${encodeURIComponent(ctx.admin_user_id)}&admin_device_id=${encodeURIComponent(ctx.admin_device_id)}`);
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.status !== 'success') {
                const err = new Error('failed');
                err.data = data;
                throw err;
            }
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length > 0) return items;
            const ids = Array.isArray(data.ids) ? data.ids : [];
            return ids.map(id => ({ user_id: id, user_name: null }));
        }

        async function sectorAdminRefreshAll() {
            const label = document.getElementById('sectorAdminIdLabel');
            const adminId = String(localStorage.getItem('sector_admin_id') || '').trim();
            if (label) label.textContent = adminId || '';
            if (!adminId) {
                setSectorManageMsg('تحقق أولاً داخل قيادة القطاع بنفس الايدي.', '#f1c40f');
                return;
            }
            setSectorManageMsg('جاري تحديث الأقسام...', '#f1c40f');
            let total = 0;
            for (const dept of SECTOR_DEPARTMENTS) {
                try {
                    const items = await fetchSectorDepartmentItems(dept.id);
                    total += items.length;
                    window.__sectorDeptCache = window.__sectorDeptCache || {};
                    window.__sectorDeptCache[dept.id] = items;
                    renderSectorItems(dept.id, items, `sectorList-${dept.id}`);
                } catch (e) {
                    const data = e && e.data ? e.data : null;
                    let msg = 'تعذر تحميل القسم.';
                    if (data && data.reason === 'hwid_mismatch') msg = 'مرفوض: ايدي القيادة مربوط بجهاز آخر.';
                    if (data && data.reason === 'not_allowed') msg = 'مرفوض: لا تملك صلاحية قيادة القطاع.';
                    const el = document.getElementById(`sectorList-${dept.id}`);
                    if (el) el.innerHTML = `<div style="color: #fecaca; font-weight: 900; padding: 0.75rem 0.5rem;">${msg}</div>`;
                }
            }
            setSectorManageMsg(`تم التحديث: ${total} ايدي.`, '#10b981');
        }

        async function sectorAdminRefreshList() {
            return sectorAdminRefreshAll();
        }

        async function sectorAdminSearch() {
            const deptSelect = document.getElementById('sectorSearchDepartment');
            const queryInput = document.getElementById('sectorSearchQuery');
            const msgEl = document.getElementById('sectorSearchMsg');
            const resultsEl = document.getElementById('sectorSearchResults');
            if (!deptSelect || !queryInput || !msgEl || !resultsEl) return;
            const deptId = String(deptSelect.value || '').trim();
            const q = normalizeSearchText(queryInput.value);
            if (!deptId) {
                msgEl.style.color = '#f1c40f';
                msgEl.textContent = 'اختر القسم قبل البحث.';
                resultsEl.innerHTML = '';
                return;
            }
            if (!q) {
                msgEl.style.color = '#f1c40f';
                msgEl.textContent = 'اكتب كلمة للبحث.';
                resultsEl.innerHTML = '';
                return;
            }
            let cache = window.__sectorDeptCache && window.__sectorDeptCache[deptId] ? window.__sectorDeptCache[deptId] : [];
            if (!cache || cache.length === 0) {
                msgEl.style.color = '#f1c40f';
                msgEl.textContent = 'جاري تحميل بيانات القسم...';
                try {
                    const items = await fetchSectorDepartmentItems(deptId);
                    window.__sectorDeptCache = window.__sectorDeptCache || {};
                    window.__sectorDeptCache[deptId] = items;
                    cache = items;
                    renderSectorItems(deptId, items, `sectorList-${deptId}`);
                } catch (e) {
                    msgEl.style.color = '#ef4444';
                    msgEl.textContent = 'تعذر تحميل بيانات القسم.';
                    resultsEl.innerHTML = '';
                    return;
                }
            }
            const filtered = cache.filter(item => {
                const id = normalizeSearchText(item.user_id);
                const name = normalizeSearchText(item.user_name);
                return id.includes(q) || name.includes(q);
            });
            msgEl.style.color = 'rgba(255,255,255,0.8)';
            msgEl.textContent = `نتائج البحث: ${filtered.length}`;
            if (filtered.length === 0) {
                resultsEl.innerHTML = `<div style="color: rgba(255,255,255,0.7); font-weight: 900; padding: 0.5rem 0.25rem;">لا توجد نتائج.</div>`;
                return;
            }
            resultsEl.innerHTML = filtered.map(item => `
                <div class="sector-item">
                    <div class="sector-item-text">
                        <div class="sector-item-name">${item.user_name ? item.user_name : 'بدون اسم'}</div>
                        <div class="sector-item-id">${item.user_id}</div>
                    </div>
                    <div class="sector-item-actions">
                        <button class="sector-mini-btn sector-mini-hwid" onclick="sectorAdminResetHwid('${item.user_id}')">HWID</button>
                        <button class="sector-mini-btn sector-mini-remove" onclick="sectorAdminRemoveId('${deptId}','${item.user_id}')">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        async function sectorAdminAddId() {
            const deptSelect = document.getElementById('sectorManageDepartment');
            const input = document.getElementById('sectorManageUserId');
            const nameInput = document.getElementById('sectorManageUserName');
            if (!deptSelect || !input) return;
            const userId = String(input.value || '').trim();
            const userName = nameInput ? String(nameInput.value || '').trim() : '';
            if (!userId) {
                setSectorManageMsg('اكتب الايدي.', '#f1c40f');
                return;
            }
            if (!userName) {
                setSectorManageMsg('اكتب الاسم.', '#f1c40f');
                return;
            }
            setSectorManageMsg('جاري الإضافة...', '#f1c40f');
            try {
                const ctx = getSectorAdminContext();
                const response = await fetch(`${BACKEND_URL}/api/ids/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        department_id: deptSelect.value,
                        user_id: userId,
                        user_name: userName,
                        admin_user_id: ctx.admin_user_id,
                        admin_device_id: ctx.admin_device_id
                    })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status !== 'success') {
                    let msg = 'فشل الإضافة.';
                    if (data && data.reason === 'hwid_mismatch') msg = 'مرفوض: ايدي القيادة مربوط بجهاز آخر.';
                    if (data && data.reason === 'not_allowed') msg = 'مرفوض: لا تملك صلاحية قيادة القطاع.';
                    if (data && data.reason === 'invalid_request') msg = 'الاسم مطلوب مع الايدي.';
                    setSectorManageMsg(msg, '#ef4444');
                    return;
                }
                input.value = '';
                if (nameInput) nameInput.value = '';
                setSectorManageMsg('تمت الإضافة.', '#10b981');
                await sectorAdminRefreshAll();

        // Function to handle authentication status check from the backend
        async function checkAuthStatus(departmentId) {
            const verificationMessage = document.getElementById(`verificationMessage-${departmentId}`);
            const verificationForm = document.getElementById(`verificationForm-${departmentId}`);
            const departmentContent = document.getElementById(`${departmentId}Content`);

            try {
                const response = await fetch(`${BACKEND_URL}/check_status?department_id=${departmentId}`);
                const data = await response.json();

                if (data.status === 'success') {
                    verificationMessage.style.color = '#10b981';
                    verificationMessage.innerText = `تم التحقق بنجاح! مرحباً بك يا ${data.username}.`; // Assuming username is returned
                    verificationForm.style.display = 'none';
                    departmentContent.style.display = 'block';
                } else if (data.status === 'failed') {
                    verificationMessage.style.color = '#ef4444';
                    verificationMessage.innerText = data.message;
                    verificationForm.style.display = 'block';
                    departmentContent.style.display = 'none';
                } else { // not_logged_in
                    verificationMessage.style.color = '#f1c40f';
                    verificationMessage.innerText = data.message;
                    verificationForm.style.display = 'block';
                    departmentContent.style.display = 'none';
                }
            } catch (error) {
                console.error("Error checking auth status:", error);
                verificationMessage.style.color = '#ef4444';
                verificationMessage.innerText = 'حدث خطأ أثناء التحقق من حالة المصادقة. يرجى المحاولة لاحقاً.';
                verificationForm.style.display = 'block';
                departmentContent.style.display = 'none';
            }
        }

        // Handle page load for Discord OAuth2 redirect
        window.onload = function() {
            renderPage(currentPage); // Render the current page first

            const urlParams = new URLSearchParams(window.location.search);
            const verified = urlParams.get('verified');
            const departmentId = urlParams.get('department_id');
            const reason = urlParams.get('reason');

            if (verified === 'true' && departmentId) {
                showPage(departmentId);
                setTimeout(() => {
                    const verificationForm = document.getElementById(`verificationForm-${departmentId}`);
                    const departmentContent = document.getElementById(`${departmentId}Content`);
                    const verificationMessage = document.getElementById(`verificationMessage-${departmentId}`);

                    if (verificationForm && departmentContent && verificationMessage) {
                        verificationForm.style.display = 'none';
                        departmentContent.style.display = 'block';
                        verificationMessage.style.color = '#10b981';
                        // The departmentTitle is not available here, so we will use a generic message
                        verificationMessage.innerText = 'تم التحقق بنجاح! مرحباً بك في صفحة القسم.';
                    }
                }, 100);

            } else if (verified === 'false' && departmentId) {
                showPage(departmentId);
                setTimeout(() => {
                    const verificationMessage = document.getElementById(`verificationMessage-${departmentId}`);
                    if (verificationMessage) {
                        let message = 'فشل التحقق. لا تسوي كذا عشان تتجنب المحاسبة العسكرية.';
                        if (reason === 'id_not_allowed') {
                            message = 'فشل التحقق. معرف ديسكورد الخاص بك غير موجود في قائمة المعرفات المسموح بها لهذا القسم.';
                        } else if (reason === 'not_member') {
                            message = 'فشل التحقق. أنت لست عضواً في السيرفر.';
                        } else if (reason === 'api_error' || reason === 'server_error') {
                            message = 'حدث خطأ أثناء التحقق. يرجى المحاولة لاحقاً.';
                        }
                        verificationMessage.style.color = '#ef4444';
                        verificationMessage.innerText = message;
                    }
                }, 100);
            }
            // Clean up URL parameters to avoid re-processing on refresh
            if (urlParams.has('verified')) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        };

        function startQuiz() {
            currentQuiz = [...quizQuestions].sort(() => Math.random() - 0.5).slice(0, 15);
            currentQuestionIndex = 0;
            quizScore = 0;
            
            document.getElementById('quiz-start').style.display = 'none';
            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('quiz-question').style.display = 'block';
            
            showQuestion();
        }

        function showQuestion() {
            const question = currentQuiz[currentQuestionIndex];
            document.getElementById('question-number').textContent = currentQuestionIndex + 1;
            document.getElementById('question-text').textContent = question.q;
            document.getElementById('current-score').textContent = quizScore;
            document.getElementById('progress-bar').style.width = ((currentQuestionIndex + 1) / 15 * 100) + '%';
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = question.options.map((opt, idx) => `
                <button onclick="selectAnswer(${idx})" class="quiz-option" data-option="${idx}" style="background: rgba(92, 108, 75); border: 2px solid rgba(92, 108, 75); color: white; padding: 1rem 1.25rem; border-radius: 12px; font-size: 1rem; text-align: right; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.75rem;">
                    <span style="width: 32px; height: 32px; background: rgba(92, 108, 75); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;">${['أ', 'ب', 'ج', 'د'][idx]}</span>
                    ${opt}
                </button>
            `).join('');
        }

        function selectAnswer(idx) {
            const question = currentQuiz[currentQuestionIndex];
            const options = document.querySelectorAll('.quiz-option');
            const isCorrect = idx === question.correct;
            
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === question.correct) {
                    opt.style.background = 'rgba(34, 197, 94, 0.3)';
                    opt.style.borderColor = '#22c55e';
                } else if (i === idx && !isCorrect) {
                    opt.style.background = 'rgba(239, 68, 68, 0.3)';
                    opt.style.borderColor = '#ef4444';
                }
            });
            
            if (isCorrect) quizScore++;
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 15) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            document.getElementById('quiz-question').style.display = 'none';
            document.getElementById('quiz-result').style.display = 'block';
            
            const percentage = (quizScore / 15) * 100;
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultSubtitle = document.getElementById('result-subtitle');
            
            if (percentage >= 80) {

        window.generateMidan = function() {
            const code = document.getElementById('midan-code')?.value;
            const num = document.getElementById('midan-num')?.value;
            const rank = document.querySelector('input[name="rank"]:checked')?.value;
            const location = document.getElementById('midan-location')?.value;
            const shared = document.querySelector('input[name="shared"]:checked')?.value;
            const extra = document.getElementById('midan-extra')?.value;

            if (!currentEntity || !code || !rank || !location || !shared) {
                showToast('الرجاء تعبئة كل البيانات');
                return;

            if (list.length === 0) {
                showToast('لا يوجد توجيهات لهذه المجموعة');
                return;
            }

            const prefix = "R-" + code;
            const mushPrefix = shared === "نعم" ? "م " : "";
            const extraValue = extra !== "none" ? " " + extra : "";
            midanResults = list.map(item => num ? `${mushPrefix}${prefix} - ${num} - ${item}${extraValue}` : `${mushPrefix}${prefix} - ${item}${extraValue}`);
            
            const container = document.getElementById('midan-results');
            container.innerHTML = midanResults.map((item, idx) => `

        window.filterVehicles = function() {
            const rankFilter = document.getElementById('rank-filter')?.value || 'all';
            const typeFilter = document.getElementById('type-filter')?.value || 'all';
            let filtered = [...vehiclesData];
            if (rankFilter !== 'all') {
                const rankIndex = rankOrder.indexOf(rankFilter);
                filtered = filtered.filter(v => rankOrder.indexOf(v.rank) <= rankIndex);
            }
            if (typeFilter !== 'all') filtered = filtered.filter(v => v.type === typeFilter);
            filtered.sort((a, b) => rankOrder.indexOf(a.rank) - rankOrder.indexOf(b.rank));
            
            const grid = document.getElementById('vehicles-grid');
            if (!grid) return;
            const getTypeBadge = (type) => type === 'رسمي' ? 'badge-blue' : type === 'سري' ? 'badge-red' : 'badge-amber';
            grid.innerHTML = filtered.map(v => `
                <div style="background: linear-gradient(135deg, rgba(30, 58, 95, 0.9), rgba(15, 23, 42, 0.95)); border-radius: 16px; overflow: hidden; border: 1px solid rgba(92, 108, 75); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative;" onmouseover="this.style.transform='translateY(-6px)';this.style.boxShadow='0 20px 40px rgba(92, 108, 75)';this.style.borderColor='rgba(59, 130, 246, 0.5)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='none';this.style.borderColor='rgba(92, 108, 75)'">
                    <div style="position: relative; overflow: hidden;">
                        <img src="${v.image}" alt="${v.name}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; transition: transform 0.4s ease;" loading="lazy" onerror="this.style.background='linear-gradient(135deg, #1c5b42, #0f172a)'">
                        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, transparent 50%);"></div>
                        <div style="position: absolute; top: 12px; left: 12px; background: ${v.type === 'رسمي' ? 'linear-gradient(135deg, #5c6c4b, #1c5b42)' : v.type === 'سري' ? 'linear-gradient(135deg, #ef4444, #dc2626)' : 'linear-gradient(135deg, #f59e0b, #d97706)'}; color: white; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; box-shadow: 0 4px 12px ${v.type === 'رسمي' ? 'rgba(92, 108, 75)' : v.type === 'سري' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(245, 158, 11, 0.4)'};">${v.type}</div>
                    </div>
                    <div style="padding: 1.25rem; background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), transparent);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                            <h3 style="font-size: 1.15rem; font-weight: 700; color: white; margin: 0;">${v.name}</h3>
                            <div style="background: linear-gradient(135deg, rgba(92, 108, 75), rgba(92, 108, 75)); color: #93c5fd; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(92, 108, 75);">${v.rank}</div>
                        </div>
                        ${v.course ? `<div style="display: flex; align-items: center; gap: 0.5rem;"><div style="background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0.3)); color: #c4b5fd; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(168, 85, 247, 0.3);">${v.course}</div></div>` : ''}
                    </div>
                </div>
            `).join('');
            document.getElementById('vehicle-count').textContent = filtered.length + ' مركبة';
        };

        // Init
        renderSidebar();
        renderPage();
    </script>
    <!-- Map Modal -->
    <div id="mapModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;padding:1rem;" onclick="closeMapModal()">
        <div style="position:relative;max-width:95%;max-height:95%;display:flex;flex-direction:column;align-items:center;">
            <button onclick="event.stopPropagation();closeMapModal()" style="position:absolute;top:-50px;left:0;background:rgba(255,255,255,0.15);border:none;color:white;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:26px;height:26px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <img id="modalMapImage" src="" alt="" style="max-width:100%;max-height:85vh;border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,0.6);" onclick="event.stopPropagation()">
            <p id="modalMapTitle" style="color:white;text-align:center;margin-top:1.25rem;font-size:1.2rem;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,0.5);"></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // Security Deterrents
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('DOMContentLoaded', function() {
            const devTeam = [
                { name: "المقداد طارق", role: "المسؤول" },
                { name: "محمد الصواف", role: "النائب" },
                { name: "سهم الحارثي", role: "مساعد" }
            ];

            const devTeamModal = document.getElementById('devTeamModal');
            const devTeamContent = document.getElementById('devTeamContent');
            const closeButton = devTeamModal.querySelector('.close-button');

            function openDevTeamModal() {
                // Clear previous content
                devTeamContent.innerHTML = '';

                // Populate modal content
                devTeam.forEach(member => {
                    const memberDiv = document.createElement('div');
                    memberDiv.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px dashed rgba(255,255,255,0.1);';
                    memberDiv.innerHTML = `
                        <span style="font-size: 1rem; color: #fff; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">${member.name}</span>
                        <span style="font-size: 0.75rem; color: #d4af37; background: rgba(212, 175, 55, 0.1); padding: 0.2rem 0.6rem; border-radius: 6px; border: 1px solid rgba(212, 175, 55, 0.2); font-weight: 800;">${member.role}</span>
                    `;
                    devTeamContent.appendChild(memberDiv);
                });
                // Remove last border
                if (devTeamContent.lastChild) {
                    devTeamContent.lastChild.style.borderBottom = 'none';
                }

                devTeamModal.style.display = 'flex'; // Make it visible before transition
                setTimeout(() => {
                    devTeamModal.classList.add('modal-open'); // Trigger fade-in and scale-up animation
                }, 10); // Small delay for display:flex to apply before transition
            }

            function closeDevTeamModal() {
                devTeamModal.classList.remove('modal-open'); // Trigger fade-out and scale-down animation
                setTimeout(() => {
                    devTeamModal.style.display = 'none'; // Hide after animation completes
                }, 300); // Match transition duration
            }

            // Event listeners
            document.getElementById('showDevTeamButton').addEventListener('click', openDevTeamModal);

            closeButton.addEventListener('click', closeDevTeamModal);

            devTeamModal.addEventListener('click', (event) => {
                if (event.target === devTeamModal) {
                    closeDevTeamModal();
                }
            });
        });
    </script>

<div id="devTeamModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;">
    <div style="background-color: #1a1a1a; margin: auto; padding: 2.5rem; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.2); width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; transform: scale(0.9); transition: transform 0.3s ease, opacity 0.3s ease;">
        <span class="close-button" style="color: #aaa; position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; font-weight: bold; cursor: pointer; transition: color 0.3s ease;">&times;</span>
        <h2 style="color: #d4af37; text-align: center; margin-bottom: 2rem; font-size: 2rem; font-weight: 800; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);">فريق التطوير</h2>
        <div id="devTeamContent" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Team members will be inserted here by JS -->
        </div>
    </div>
</div>

<style>
    .modal-open {
        opacity: 1 !important;
        display: flex !important; /* Make it visible and use flexbox */
        pointer-events: auto !important; /* Allow interaction when open */
    }
    .modal-open > div {
        transform: scale(1) !important;
    }
    .close-button:hover {
        color: #d4af37 !important;
    }
</style>
</body>
</html>
